definitions:
  - id: executive-community
    term: Executive community
    definition: A structured network of senior leaders connected by a relevant shared identity and recurring opportunities to exchange useful knowledge and relationships.
  - id: global-executive-network
    term: Global executive network
    definition: A network connecting senior leaders across multiple markets through shared identity, clear membership standards and recurring opportunities to build trusted professional relationships.
  - id: ceo-peer-group
    term: CEO peer group
    definition: A recurring, facilitated group in which chief executives examine decisions, challenges and leadership responsibilities with peers.
